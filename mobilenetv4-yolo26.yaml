nc: 10 # 10 classes in VisDrone
scales:
  n: [0.33, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
# conv 0
 - [-1, 1, Conv, [32, 3, 2, 1]]
# layer 0
 - [-1, 1, Conv, [32, 3, 2, 1]]
 - [-1, 1, Conv, [32, 1, 1]]
 # layer 1
 - [-1, 1, Conv, [96, 3, 2, 1]]
 - [-1, 1, Conv, [64, 1, 1]] # P3, #4
# layer 2
 - [-1, 1, UniversalInvertedBlock, [96, 5, 2, 3.0, True, True]]
 - [-1, 4, UniversalInvertedBlock, [96, 3, 1, 2.0, False, True]]
 - [-1, 1, UniversalInvertedBlock, [96, 3, 1, 4.0, True, False]] # P4, #7
# layer 3
 - [-1, 1, UniversalInvertedBlock, [128, 3, 2, 6.0, True, True]]
 - [-1, 1, UniversalInvertedBlock, [128, 5, 1, 4.0, True, True]]
 - [-1, 1, UniversalInvertedBlock, [128, 5, 1, 4.0, False, True]]
 - [-1, 1, UniversalInvertedBlock, [128, 5, 1, 3.0, False, True]]
 - [-1, 2, UniversalInvertedBlock, [128, 3, 1, 4.0, False, True]] # P5, #12

head:
  - [4, 1, Conv, [256, 1, 1]] # Project P3 to 256 channels, #13
  - [7, 1, Conv, [512, 1, 1]] # Project P4 to 512 channels, #14
  - [12, 1, Conv, [1024, 1, 1]] # Project P5 to 1024 channels, #15

  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] #17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 14], 1, Concat, [1]] # concat backbone P4
  - [-1, 2, C3k2, [512, True]] #20

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 13], 1, Concat, [1]] # concat backbone P3
  - [-1, 2, C3k2, [256, True]] #23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]] # concat head P4
  - [-1, 2, C3k2, [512, True]] #26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # concat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] #29 (P5/32-large)

  - [[23, 26, 29], 1, Detect, [nc]] # Detect(P3, P4, P5)